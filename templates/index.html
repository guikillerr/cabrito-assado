<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cabrito Assado</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>


    <!-- MÚSICA -->

    <audio id="musica" loop>

        <source
            src="{{ url_for('static', filename='musica/musica.mp3') }}"
            type="audio/mpeg"
        >

    </audio>


    <!-- MENU -->

    <nav class="menu">

        <a
            href="/"
            class="botao-menu"
        >

            <img
                src="{{ url_for('static', filename='imagens/home.png') }}"
                alt="Home"
            >

        </a>


        <a
            href="/galeria"
            class="botao-menu"
        >

            <img
                src="{{ url_for('static', filename='imagens/galeria.png') }}"
                alt="Galeria"
            >

        </a>

    </nav>


    <!-- CONTEÚDO PRINCIPAL -->

    <main class="conteudo">

        <img
            src="{{ url_for('static', filename='imagens/logo.png') }}"
            alt="Cabrito Assado"
            class="logo"
        >


        <form method="POST">

            <label for="nome">
                Digite seu nome:
            </label>


            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Seu nome"
                autocomplete="off"
                required
            >


            <button type="submit">
                Entrar
            </button>

        </form>


        <!-- FOTO ENCONTRADA -->

        {% if foto %}

            <div class="resultado">

                <h2>
                    Salve, {{ nome }}! 😂
                </h2>

                <img
                    src="{{ url_for('static', filename='imagens/' + foto) }}"
                    alt="Foto de {{ nome }}"
                    class="foto-pessoa"
                >

            </div>

        {% endif %}


        <!-- NOME NÃO ENCONTRADO -->

        {% if mensagem %}

            <p class="mensagem-erro">

                {{ mensagem }}

            </p>

        {% endif %}


    </main>


    <!-- BOTÃO MÚSICA -->

    <button
        id="botao-musica"
        class="botao-musica"
        type="button"
    >

        🔊 Música

    </button>


    <!-- JAVASCRIPT DA MÚSICA -->

    <script>

        const musica =
            document.getElementById("musica");

        const botaoMusica =
            document.getElementById("botao-musica");


        musica.volume = 0.25;


        /*
        O navegador pode bloquear autoplay.
        Nesse caso, a música começa após
        o primeiro clique do usuário.
        */

        musica.play().catch(() => {

            document.addEventListener(

                "click",

                () => {

                    musica.play();

                },

                { once: true }

            );

        });


        botaoMusica.addEventListener(
            "click",
            () => {

                if (musica.paused) {

                    musica.play();

                    botaoMusica.textContent =
                        "🔊 Música";

                }

                else {

                    musica.pause();

                    botaoMusica.textContent =
                        "🔇 Música";

                }

            }
        );

    </script>


</body>

</html>
